# Accounts manifest — calendar and email identities that feed the daily brief.
#
# Each account here can have a calendar and/or an email feed. The fetcher
# writes to `system/inbox/calendar.<id>.json` and/or `system/inbox/email.<id>.json`;
# the overlays aggregate across all enabled accounts and dedup by event/thread id.
#
# The set of `email` values across all accounts is treated as the
# operator's "self" set — used to skip self-attendee matching, identify
# sent threads, etc.
#
# Field meanings:
#   id           — kebab-case identifier. Used as the per-file suffix.
#   label        — human-readable description shown in the brief and reports.
#   email        — the address this identity sends/receives from.
#   role         — work | personal | board | side-project | other. Informational.
#   feeds        — which streams this account contributes: [calendar, email].
#   enabled      — false to suspend without deleting the entry.
#   mcp_status   — informational: where the Cowork connector currently points.
#   notes        — free-text context for future operators (or future-you).
#
# Operational rules:
#   * Most users have more than one active Google identity. Each enabled row
#     can contribute both calendar and email; the overlay aggregates and tags
#     every event / thread with its `account_id`.
#   * The PRIMARY identity is the user's personal/default operating identity.
#     For Todd that is `personal` (vahlsingt@gmail.com), while BridgePoint is
#     an active work identity. Both should normally carry [calendar, email].
#   * When a connector points at a different account than this manifest
#     claims, fetches will land in the wrong file. The fetcher validates
#     against this manifest and warns on mismatch.

version: 2
last_updated: 2026-05-16

accounts:

