    - name: IKEA Food Truck POS + KDS Budgetary Proposal
      source_url: https://drive.google.com/file/d/1plVx5Nt4ankXevyNdnQDSvJVsLV4b_oT
      validated_on: "2026-07-23"
      validation: Received major kudos from Todd's skip-level leader.
