# ── Job Search Intelligence Gate ─────────────────────────────────────────────
# Set job_search_active: true to enable job intelligence scanning and brief surfacing.
# When false: job_intelligence section is completely suppressed from the daily brief.
# When true:  email, LinkedIn messages, and relationship signals are scanned for
#             job postings matching the profile. Roles are scored and surfaced with links.
job_search_active: false
career_phase: onboarding  # offer_accepted 2026-06-21 — Global Payments / Worldpay Sales Executive

# job_search_context: populated when job_search_active is true.
# Defines the filter and scoring criteria for job opportunity detection.
# Leave null when not searching — it will not be used.
job_search_context:
  # Target role titles (any match triggers deeper analysis)
  target_titles:
    - Chief Revenue Officer
    - Chief Sales Officer
    - VP Enterprise Sales
    - VP Sales
    - Head of Sales
    - Head of Revenue
    - VP Customer Success
    - SVP Sales
    - General Manager
    - Managing Director
    - President
    - COO
  # Target companies (any match elevates fit score)
  target_companies:
    - Toast
    - PAR Technology
    - Olo
    - NCR Voyix
    - Oracle Hospitality
    - Agilysys
    - Restaurant365
    - Qu
    - Harri
    - Coates Group
    - Global Payments
    - Shift4
    - Foods Connected
    - HungerRush
    - Presto
    - Xenial
  # Minimum fit score to surface in brief (0–100)
  minimum_fit_score: 60
  # Sources to scan (email | linkedin | both)
  scan_sources: both
  # Lookback window for job signal detection (days)
  scan_days: 14
  # Whether to include speculative roles (no formal posting, just signal)
  include_speculative: true
  # Geography preference (null = no filter)
  geography_preference: "US"
  # Compensation range (null = no filter)
  compensation_minimum: null

# Buyer personas Todd can access
