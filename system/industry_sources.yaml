  # ══════════════════════════════════════════════════════════════════════════
  # SIGNAL FEEDS (RB-9.65) — broad streams, filtered via entity-watchlist
  # matching in detect_entities(). These are noisy on their own but classify_*
  # + entity matching surfaces only items mentioning the 100+ watchlist
  # entities (M&A, exec changes, funding) — used for watchlist_intelligence.
  # ══════════════════════════════════════════════════════════════════════════

  - name: "SEC EDGAR Recent 8-K Filings"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&dateb=&owner=include&count=100&output=atom"
    default_domain: mixed
    confidence: high
    description: "All public-company 8-K filings (material events: M&A, exec changes, earnings) — filtered to watchlist entities by entity matching"
    max_items: 20

