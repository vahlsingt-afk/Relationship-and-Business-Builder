# industry_sources.yaml — RB Industry Intelligence Sources
# ─────────────────────────────────────────────────────────────────────────────
# This file configures which external RSS/Atom feeds the RB web scanner fetches
# each morning. Edit this file to match your industry — no code changes needed.
#
# default_domain options
# ──────────────────────
#   world_national      — world and national news (always included; centrist mix)
#   industry_primary    — your core industry coverage (ops, brands, deals, market)
#   industry_technology — technology within your industry (platforms, vendors, software)
#   mixed               — classify per article using built-in keyword heuristics
#
# confidence options:  high | medium | low
# max_items:           max headlines to pull per source per cycle (default 20)
#
# Notes on world/national sources
# ────────────────────────────────
# The three world sources below (Reuters, AP, WSJ) are intentionally balanced:
#   Reuters — internationally neutral; wire service standard
#   AP      — US-based; institutional neutrality by editorial charter
#   WSJ     — center-right; strong business/finance/economic depth
# If you want additional balance, uncomment NPR Business or Axios below.
#
# RSS feed URLs change occasionally. If a source stops returning results,
# check the publication's website for an updated /feed or /rss.xml path.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONBOARDING: If you are not in restaurant technology, clear the sources below
# and replace with feeds for your industry. See the onboarding template at:
#   system/onboarding/industry_sources_template.yaml
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  industry_name: "Restaurant Technology"
  primary_label: "Restaurant Industry"
  technology_label: "Restaurant Technology"
  world_label: "World & National"
  version: "2.0"

sources:

  # ══════════════════════════════════════════════════════════════════════════
  # WORLD & NATIONAL — general news plus business, centrist/balanced reporting
  # 3-5 sources; aim for ideological balance across the set
  # ══════════════════════════════════════════════════════════════════════════

  # Reuters and AP RSS feeds are blocked (403/DNS). BBC, NPR, Yahoo Finance confirmed working.
  # WSJ RSS blocked (403) — replaced with Yahoo Finance and Axios (both open access).
  #
  # Prior to 2026-07-06 every source in this section was a *business* feed
  # (BBC Business, NPR Business, Yahoo Finance, Axios Business), so no amount
  # of relevance-keyword tuning could surface a genuine politics/war/labor-
  # market story — those stories were never fetched in the first place. Added
  # BBC World News and NPR general News as true world/national feeds per
  # Todd's feedback: "politics, wars, oil prices and consumer spending are
  # all things that are important."
  # Last verified: 2026-07-06

  - name: "BBC World News"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    default_domain: world_national
    confidence: high
    description: "General world news — politics, conflict, diplomacy; not business-filtered"
    max_items: 8

  - name: "NPR News"
    url: "https://feeds.npr.org/1001/rss.xml"
    default_domain: world_national
    confidence: high
    description: "US public radio general news — politics, national affairs; not business-filtered"
    max_items: 8

  - name: "BBC Business"
    url: "https://feeds.bbci.co.uk/news/business/rss.xml"
    default_domain: world_national
    confidence: high
    description: "International wire standard — BBC, neutral, globally authoritative"
    max_items: 8

  - name: "NPR Business"
    url: "https://feeds.npr.org/1006/rss.xml"
    default_domain: world_national
    confidence: high
    description: "US public radio business coverage — institutional neutrality, domestic focus"
    max_items: 8

  - name: "Yahoo Finance News"
    url: "https://finance.yahoo.com/news/rssindex"
    default_domain: world_national
    confidence: medium
    description: "Aggregated business and financial news — broad market coverage, center"
    max_items: 8

  - name: "Axios Business"
    url: "https://api.axios.com/feed/"
    default_domain: world_national
    confidence: medium
    description: "Concise, centrist business and tech news — macro trends and deals"
    max_items: 5

