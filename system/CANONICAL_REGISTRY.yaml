      - system/scripts/competitor_intelligence_common.py
      - system/scripts/account_reference_detector.py (auto-linked reference evidence)
      - system/scripts/competitive_brief.py (persists render_competitor_profile()'s output -- see known_gap below)
      - system/scripts/genius_capabilities.py (RB-2026-09-25: Todd's own curated Genius product-capability library, per GENIUS_PRODUCT_LINES category -- separate flat store, system/genius_capabilities.json, not per-competitor)
      - system/scripts/value_wedge.py (RB-2026-09-25: persists a competitor-scoped "why Genius wins" document pairing genius_capabilities.py against that competitor's category battle cards + vs_genius.competitor_advantages -- see competitive_landscape's note below)
    validation: not_yet_built
    freshness_policy: not_yet_declared
    conflict_policy: not_yet_declared
    known_gap: >-
      FIXED 2026-09-07 (same day, follow-up to the audit that found it):
      render_competitor_profile()/generate_profile() still only return their
      markdown in the API response and are unchanged -- but
      competitive_brief.py::generate_competitive_brief() now versions that
      same markdown into system/artifact_vault/competitive_briefs/<competitor_slug>/
      via artifact_vault_common.py, indexed in intelligence_index.py under
      resource_type competitive_brief (getCompetitiveBrief/createCompetitiveBrief
      in server.py). getCompetitorProfile itself is untouched and still
      computes fresh, by design -- this is a parallel persisted path, not a
      change to the existing endpoint.
      FIXED 2026-09-25: render_competitor_profile() previously never
      rendered category_battle_cards content at all (only battle_card.py's
      category-scoped Battle Card did) -- Competitive Brief now aggregates
      every category this competitor has a battle card for, via a shared
      render_category_battle_card_body() helper in
      competitor_intelligence_common.py (also used by battle_card.py and
      value_wedge.py, so the three documents never render this content
