    authoritative_store: system/watchlist_registry.json
    evidence_stores:
      - system/.cache/technomic_watchlist_history.jsonl
      - system/.cache/technomic_watchlist_promoted.json
    mutation_owner:
      - system/scripts/watchlist_registry.py
      - system/scripts/technomic_watchlist_scan.py (also writes system/ecosystem_intelligence.json directly -- see industry_ecosystem_intelligence's mutation_owner list)
      - system/scripts/watchlist_promotion.py (candidate scoring/promotion; confirmed 2026-09-06 to be the only writer of watchlist_registry.json, and structurally cannot produce a candidate with no matching ecosystem_intelligence.json entity)
    validation: not_yet_built
    freshness_policy: not_yet_declared
    conflict_policy: not_yet_declared
    legacy_status: not_applicable_new_domain

  competitive_landscape:
    authority_status: computed_on_demand_not_persisted
    note: >-
      RB-2026-09-07: added, same audit. Market-share/battle-card views
      computed purely at query time from industry_ecosystem_intelligence's
      authoritative_store -- has no store of its own. The one persistence
      path (competitive_landscape_export.py::export_workbook()) writes a
      timestamped, on-demand system/exports/competitive-landscape-*.xlsx
      that is not retained/indexed anywhere after creation.
      FIXED (partially) same day: battle_card.py::generate_battle_card()
      now versions battle_card_for_category()'s own computed markdown into
      system/artifact_vault/battle_cards/<category>/ via
      artifact_vault_common.py, indexed under resource_type battle_card
      (getBattleCard/createBattleCard in server.py). This engine
      (competitive_landscape.py) and getCategoryMarketShare are unchanged
      and still compute fresh by design -- battle_card.py is a parallel,
      additive persisted view, not a replacement.
      Same day, third competitive-side view added: vendor_engagement_analysis.py
      is account-scoped (not category- or competitor-scoped like the two
      above) -- for one account, which vendor(s) it actually uses (joining
      account.technology_stack with the richer uses_vendor_for_category
      relationship fields this domain's own note above already describes as
      dropped by render_technology_environment_section) plus a competitive
      angle for any vendor that's also a tracked competitor. Persists to
      system/artifact_vault/vendor_engagement_analyses/<account_slug>/,
      resource_type vendor_engagement_analysis. Genuinely new content, not a
      persistence layer over an existing computed function like the other two.
      RB-2026-09-25, fourth competitive-side view added: value_wedge.py is
      competitor-scoped like competitive_brief.py, but framed as "why
      Genius wins against THIS competitor specifically" rather than a
      general profile -- for every product line the competitor competes on
      (competes_on), pairs genius_capabilities.py's (new, competitor_
      intelligence's own domain -- Todd's curated "what Genius offers")
      content for that category with the category's battle card and
      vs_genius.competitor_advantages. Persists to
      system/artifact_vault/value_wedges/<competitor_slug>/, resource_type
      value_wedge. Deliberately does not call sync_from_ecosystem() --
      nothing it renders is evidence-sourced.
    authoritative_store: null (derives from industry_ecosystem_intelligence.authoritative_store)
    mutation_owner: []  # read-only compute; writes nothing
    generator:
      - system/scripts/competitive_landscape.py
      - system/scripts/competitive_landscape_export.py
      - system/scripts/battle_card.py (persists a rendering of battle_card_for_category(), does not recompute it)
      - system/scripts/vendor_engagement_analysis.py (account-scoped view, joins this domain with customers_prospects + competitor_intelligence)
      - system/scripts/value_wedge.py (competitor-scoped "why Genius wins" view, joins this domain's category battle cards with competitor_intelligence's genius_capabilities.py)
    validation: not_applicable
    freshness_policy: as fresh as industry_ecosystem_intelligence at query time
    conflict_policy: not_applicable
    legacy_status: not_applicable_new_domain

  vulnerability_signals:
    authority_status: computed_on_demand_not_persisted
    note: >-
      RB-2026-09-07: added, same audit. Feeds the Daily Brief's "Competitive
      Opportunity Watchlist." competitive_vulnerability.py::build_report()
      is a pure in-memory computation with no store of its own -- its
      --cache CLI flag would persist system/.cache/competitive_vulnerability.json
      but no caller (daily_brief.py calls build_report() directly) actually
      invokes it with --cache, so the result is only durable as whatever
      ends up embedded in that day's system/briefs/ output.
    authoritative_store: null (derives from industry_ecosystem_intelligence + system/.cache/entity_alerts.json + web-scanner/LinkedIn friction signals + earnings signals)
    mutation_owner: []  # read-only compute; writes nothing under normal operation
    generator:
      - system/scripts/competitive_vulnerability.py
    validation: not_applicable
    freshness_policy: computed fresh on every daily_brief.py invocation
    conflict_policy: not_applicable
    legacy_status: not_applicable_new_domain

  audit_sessions_receipts:
    authority_status: operational
    authoritative_stores:
      - system/audit/*.jsonl
      - system/_sessions/*.md
      - system/ri_events/*.jsonl
      - system/.cache/*receipt*.json
    projections:
      - system/_sessions/index.json
      - system/MANIFEST.md
    schema: system/SCHEMAS.md
    mutation_owner:
      - system/scripts/session_writer.py
      - system/scripts/session_index.py
      - mutation-specific scripts
    validation:
      - python3 system/scripts/session_index.py
      - python3 system/scripts/validate_baseline.py
    freshness_policy: material sessions and mutations must emit dated trace records
    conflict_policy: append corrections; do not rewrite closed historical records
    legacy_status: retain

