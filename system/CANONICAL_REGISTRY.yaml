      matched graph entity where one exists.
    authoritative_store: system/franchisee_finder/organizations/*/{organization.json,evidence.jsonl}
    projections:
      - system/franchisee_finder/_portfolio/franchisee_registry.json
    schemas:
      - system/scripts/franchisee_finder_common.py (the shape; no separate JSON schema file)
    mutation_owner:
      - system/scripts/migrate_franchisee_hierarchy.py (one-time seed import only -- Phase 1 has no live write/submission path)
      - system/scripts/franchisee_finder_common.py
    validation: not_yet_built
    freshness_policy: not_yet_declared
    conflict_policy: not_yet_declared
    known_gap: >-
      Phase 1 only: no legal-entity data, no ownership-structure data, no
