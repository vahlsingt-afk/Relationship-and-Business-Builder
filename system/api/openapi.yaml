  /graphs/micro_summary:
    get:
      tags:
      - compute
      summary: Get Micro Graph Summary
      description: "Return a compact summary for indexed micro ecosystem graphs.\n\
        \nThis is the Custom GPT-safe retrieval surface for large dormant micro graphs.\n\
        It returns registry data when no graph matches and compact index data when\
        \ a\ngraph is found.\n\nUse query_type for structured precision queries:\n\
        \  - operator_count: how many operators/franchisees and what tier breakdown\n\
        \  - largest_operators: top operators ranked by store count\n  - state_lookup:\
        \ store counts by state (optionally filtered by state=XX)\n  - coop_lookup:\
        \ store counts by co-op region\n  - city_lookup: operators and stores for\
        \ a specific city (city=, state=)\n  - operator_lookup: detail for a named\
        \ operator (name=)\n  - threshold_lookup: operators above/below a store count\
        \ (min_stores=, max_stores=)\n  - staff_lookup: support staff by name or role\
        \ (name= or role=fbp/otm/otp, state=)\n  - coop_detail: operator breakdown\
        \ within a specific co-op (coop=)\n  - relationship_coverage: baseline contacts\
        \ at this company\n  - summary (default): full index summary with all sections"
      operationId: getMicroGraphSummary
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Graph slug or search term, e.g. mcdonalds_us_ops or McDonald's.
          title: Query
        description: Graph slug or search term, e.g. mcdonalds_us_ops or McDonald's.
      - name: query_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Structured query type for precision retrieval. One of: operator_count,
            largest_operators, state_lookup, coop_lookup, city_lookup, operator_lookup,
            threshold_lookup, staff_lookup, coop_detail, relationship_coverage, summary
            (default = full index summary). Common params: state= (state_lookup),
            city=+state= (city_lookup), name= (operator_lookup/staff_lookup), min_stores=/max_stores=
            (threshold_lookup), role=fbp|otm|otp (staff_lookup), coop= (coop_lookup/coop_detail).
            relationship_coverage returns baseline contacts at this company; operator_count/largest_operators
            need no params.'
          title: Query Type
        description: 'Structured query type for precision retrieval. One of: operator_count,
          largest_operators, state_lookup, coop_lookup, city_lookup, operator_lookup,
          threshold_lookup, staff_lookup, coop_detail, relationship_coverage, summary
          (default = full index summary). Common params: state= (state_lookup), city=+state=
          (city_lookup), name= (operator_lookup/staff_lookup), min_stores=/max_stores=
          (threshold_lookup), role=fbp|otm|otp (staff_lookup), coop= (coop_lookup/coop_detail).
          relationship_coverage returns baseline contacts at this company; operator_count/largest_operators
          need no params.'
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: State abbreviation filter (state_lookup, city_lookup, staff_lookup),
            e.g. WI, TX, CA.
          title: State
        description: State abbreviation filter (state_lookup, city_lookup, staff_lookup),
          e.g. WI, TX, CA.
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: City name for city_lookup, e.g. 'Fond du Lac'. Case-insensitive.
          title: City
        description: City name for city_lookup, e.g. 'Fond du Lac'. Case-insensitive.
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
