  /ingest/upload:
    post:
      tags:
      - ingest
      summary: Accept a file upload from the GPT and route it through the correct
        ingest pipeline
      description: "Receive a file from the Custom GPT conversation and ingest it.\n\
        \nDEFECT-024: The user workflow is to upload a file to the Custom GPT.\nThis\
        \ endpoint is the bridge: the GPT reads the uploaded file content,\nencodes\
        \ it as base64, and POSTs it here. The server writes it to the\ncorrect inbox\
        \ directory and runs the appropriate ingest pipeline.\n\nStructured file routing:\n\
        \  - LinkedIn export ZIP (.zip)  → inbox/linkedin_exports/ → linkedin_ingest\n\
        \  - WhatsApp export (.txt/.zip) → inbox/whatsapp_exports/ → whatsapp_ingest\n\
        \  - Contacts export (.vcf/.csv) → inbox/contacts_exports/ → contacts_ingest\n\
        \  - HubSpot CRM export (.csv, classified by header vocabulary)\n        \
        \                        → inbox/crm_exports/ → hubspot_ingest\n  - Conference/event\
        \ registration list (.csv, classified by header\n    vocabulary) → inbox/conference_exports/\
        \ → campaign_engine reconciliation.\n    Requires `campaign_id` in the request\
        \ if more than one campaign exists\n    (see GET /campaigns).\n  - Recognized\
        \ xlsx/xlsm workbook (RB-DEFECT-065: dataset_classifier clears\n    the auto-ingest\
        \ confidence bar, e.g. McDonald's NSN Lookup workbook)\n                 \
        \               → inbox/micro_graph_sources/ → micro-graph builder\n  - Raw\
        \ audio recording (.m4a/.mp3/.mp4/.wav/.ogg, e.g. a JPR call pasted\n    directly\
        \ into chat instead of picked up by the folder-watch sweep)\n            \
        \                    → inbox/chat_capture_uploads/ → queued for\n    background\
        \ Whisper transcription via capture_ingest.queue_file, same\n    engine scanCaptureSources\
        \ uses. Returns immediately (real transcription\n    takes real time) — call\
        \ getCaptureScanStatus to check progress, then\n    getCapturesPending for\
        \ the resulting file_id. That file_id (NOT this\n    call's ingestion_id —\
        \ a different ID space) is what getCaptureProcessed/\n    submitCapture need.\n\
        \  - Other artifacts             → inbox/user_artifacts/ → triage + mutations\n\
        \nReturns a processing receipt with:\n  - file_written: path where the file\
        \ was saved\n  - pipeline_run: which ingest pipeline was invoked\n  - ingest_result:\
        \ the full pipeline output (delta counts, mutations, etc.)\n  - ingestion_id:\
        \ deterministic ID for this upload (sha256[:16] of content)\n\nThe receipt\
        \ can be referenced in the daily brief as proof of processing.\ndry_run=true\
        \ writes the file but does not mutate baseline — useful for\npreviewing what\
        \ an ingest would produce.\n\nRaises 413 for a known-large export type (LinkedIn/WhatsApp\
        \ ZIP) whose\ncontent never arrived — the payload likely never survived base64-encoding\n\
        into the Action call. The error message names the correct watched inbox\n\
        folder for that file type; relay it verbatim and do not retry, since a\nretry\
        \ will hit the identical platform-level failure."
      operationId: uploadAndIngestFile
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
