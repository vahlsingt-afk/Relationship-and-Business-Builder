  /ingest/executive_declaration:
    post:
      tags:
      - compute
      summary: Post Exec Declaration
      description: "Process a CEO first-person state declaration and auto-mutate canonical\
        \ state.\n\nCEO declarations are authoritative — highest-fidelity source in\
        \ the priority hierarchy.\nNo confirmation required for unambiguous declarations.\n\
        \nSupported event types:\n- opportunity_accepted: \"I accepted the offer\"\
        \n- opportunity_declined: \"I declined / passed on the opportunity\"\n- relationship_touch:\
        \ \"I talked to / met with / called [person] today\"\n- action_completed:\
        \ \"I sent / submitted / completed [action]\"\n- state_resolved: \"the well\
        \ pump is working\", \"it's fixed\", \"resolved\" (RB-DEFECT-060)\n- loop_advanced:\
        \ \"Ryan responded\", \"heard back from [person]\" (RB-DEFECT-060)\n- start_date_set:\
        \ \"My start date is [date]\"\n- personal_practice_logged: \"Mary and I prayed\
        \ and read the bible together\" (RB-DEFECT-062)\n\nMutations applied immediately\
        \ to:\n- tracked_opportunities.json (stage, candidate_position, history)\n\
        - active_threads.yaml (status, close_date, close_reason, current_state)\n\
        - interaction_ledger.json (new interaction entry)\n- system/eolms/loops.json\
        \ — action_completed/state_resolved/loop_advanced additionally\n  run eolms.match_and_transition()\
        \ against the EOLMS register; a confident single match\n  is transitioned\
        \ (e.g. to completed, or waiting -> active) and included in the response\n\
        \  under a \"eolms_loop_transition\" mutation entry. Ambiguous or no-match\
        \ text is reported\n  but nothing is auto-closed — see eolms.py's match_and_transition\
        \ docstring.\n- system/personal_log.json — personal_practice_logged matches\
        \ every manually-tracked Life\n  Lens goal (see life_goals.yaml's log_keywords)\
        \ mentioned in the text and marks each True\n  for the resolved date (explicit\
        \ \"yesterday\" in the text wins over event_at), included\n  under a \"personal_log_update\"\
        \ mutation entry. See personal_log.py's\n  record_personal_practice() docstring.\n\
        - system/personal_relationship_log.json / system/personal_timeline.json —\
        \ the same\n  personal_practice_logged declarations are also checked for personal-relationship\n\
        \  events (\"date night\", \"supported Mary at her retirement party\") and\
        \ significant\n  life events, included under a \"personal_relationship_event\"\
        \ mutation entry when\n  present. Intelligence only — never creates a to-do/loop\
        \ for content describing\n  something that already happened. See personal_log.py's\n\
        \  record_personal_relationship_events() docstring."
      operationId: ingestExecutiveDeclaration
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecDeclIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ingest:
    post:
      tags:
      - compute
      summary: Post Ingest
      description: "Consolidated content ingestion — full 5-phase intelligence pipeline\
        \ on demand.\n\nThe mandatory first call for ANY incoming content (paste,\
        \ screenshot, article,\nnewsletter, post, transcript, note, earnings release).\
        \  Runs the same pipeline\nas the scheduled morning assessment but triggered\
        \ by user-supplied content.\n\nPhase 1 — Triage: classify all intelligence\
        \ types present (macro_signal,\n  ri_event, micro_graph_enrichment, micro_graph_build,\
        \ strategic_memory, noise).\n\nPhase 2 — Entity Context: looks up 30-day DB\
        \ history for every detected entity.\n  entity_context: {entity_name: entity_summary}\
        \ — only entities with DB items.\n\nPhase 3 — Convergence Analysis: queries\
        \ existing IntelligenceDB for multi-source\n  entities and entity pairs. \
        \ Shows what sustained patterns already exist and\n  where the new content\
        \ fits.\n\nPhase 4 — Mutation Proposals: generates watchlist_add and thread_intelligence\n\
        \  proposals from convergence findings.  All require_confirmation: true.\n\
        \nPhase 5 — Trust Stats: unified block (same contract as scheduled assessment)\n\
        \  with source='on_demand'.  Drives the Receipt rendering in the CoS.\n\n\
        This endpoint is ALWAYS read-only — no DB writes occur.  Every proposed\n\
        mutation in mutation_proposals carries requires_confirmation=True."
      operationId: ingestContent
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestIn'
      responses:
