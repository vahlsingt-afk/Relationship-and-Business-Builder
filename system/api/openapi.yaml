            PAR Technology, etc.), and campaign (conference invitation roster, registration
            status, coverage gaps). Examples: ''How many McDonald\''s operators are
            in the US?'', ''What is PAR Technology\''s exit positioning?'', ''Who
            should I reach out to at Toast?'', ''What behavioral signals have we captured
            about consumer hesitation?'', ''What POS does Chipotle run?'', ''What''s
            the status of the Global Payments opportunity?'', ''Who hasn''t registered
            for the Genius conference yet?'''
