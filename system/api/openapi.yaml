openapi: 3.1.0
info:
  title: Relationship Builder API
  description: HTTP wrapper around the deterministic Relationship Builder compute
    scripts. Designed to be the Actions backend for a Custom GPT. Read-only.
  version: 0.1.0
servers:
- url: http://localhost:8765
  description: local dev
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Liveness probe. No auth required. Returns user-agent for diagnostics.
      operationId: health_health_get
      parameters:
      - name: user-agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /daily_brief:
    get:
      tags:
      - compute
      summary: Get Daily Brief
      description: 'Mandatory source-of-truth retrieval for every Custom GPT Daily
        Brief.


        Prefer the published canonical artifact on the cached path. This keeps the

        action response small and stable enough for ChatGPT while preserving

        `use_cache=false` as the explicit rebuild path. Callers must require

        `status=ok` and `retrieval_receipt.verified=true`; they must never replace

        a failed or skipped retrieval with a brief synthesized from memory.

        `execution_report` is the authoritative same-day refresh receipt.'
      operationId: getDailyBrief
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO date 'YYYY-MM-DD' for the brief; defaults to today.
          title: Date
        description: ISO date 'YYYY-MM-DD' for the brief; defaults to today.
      - name: use_cache
        in: query
        required: false
        schema:
          type: boolean
          description: Use the cached report if fresh.
          default: true
          title: Use Cache
        description: Use the cached report if fresh.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid x-api-key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /daily_brief/part2:
    get:
      tags:
      - compute
      summary: Get Daily Brief Part2
      description: 'Part 2 of 2 of the Daily Brief — call AFTER getDailyBrief (Part
        1).


        RB 9.69: a single getDailyBrief response was approaching the ~70KB Action

        payload ceiling, which forced silent, size-based trimming of whichever

        section happened to be largest. The brief is now split across two calls

        so each half has room for the canonical template''s full content —

        especially Section 3''s mandatory per-entity watchlist coverage and

        Section 4''s My Priorities (calendar, opportunities, loops, weekly goals,

        CoS recommendations).


        Always call getDailyBrief first; its `continuation` field tells the GPT

        when and how to offer this call to the user. Use the same `date` as the

        Part 1 call so both halves describe the same brief.'
      operationId: getDailyBriefPart2
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO date 'YYYY-MM-DD' for the brief; defaults to today. Use
            the SAME date as the matching getDailyBrief (Part 1) call.
          title: Date
        description: ISO date 'YYYY-MM-DD' for the brief; defaults to today. Use the
          SAME date as the matching getDailyBrief (Part 1) call.
      - name: use_cache
        in: query
        required: false
        schema:
          type: boolean
          description: Use the cached report if fresh.
          default: true
          title: Use Cache
        description: Use the cached report if fresh.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or invalid x-api-key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /daily_brief/external:
    get:
      tags:
      - compute
      summary: Get External Brief
      description: 'Restaurant Industry & Technology Intelligence report — teammate-shareable.


        Publishes Tuesdays and Fridays only, accumulating every fresh restaurant

        industry/technology headline since the last published edition. On any

        other day this returns the most recently published edition unchanged

        (no fresh build). World/national news is out of scope for this report.


        Use format=html to get a styled HTML email ready for distribution.'
      operationId: getExternalBrief
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: '''json'' or ''html'''
          default: json
          title: Format
        description: '''json'' or ''html'''
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/bootstrap_status:
    get:
      tags:
      - diagnostic
      summary: Get Public Bootstrap Status
      description: "No-auth diagnostic endpoint. Returns API liveness and graph mount\
        \ count only.\n\nUse this to isolate auth failures from tunnel/API failures:\n\
        - If this responds: the API and tunnel are alive.\n- If /daily_brief returns\
        \ 'invalid or missing x-api-key' but this works:\n  the Custom GPT Action\
        \ auth is misconfigured. Fix: GPT Builder → Actions →\n  Authentication →\
        \ API Key → Auth Type: Custom → Custom Header Name: x-api-key\n  → paste your\
        \ RB_API_KEY value → Save.\n\nNo private data is returned. Entity names and\
        \ brief content are not exposed."
      operationId: getPublicBootstrapStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /brief/health:
    get:
      tags:
      - compute
      summary: Get Brief Health
      description: Return source_health.json from cache. 404 if not yet generated.
      operationId: getBriefHealth
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /brief/latest-json:
    get:
      tags:
      - compute
      summary: Get Brief Latest Json
      description: Return the most recently published brief.json artifact.
      operationId: getBriefLatestJson
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/collection:
    get:
      tags:
      - compute
      summary: Get Intelligence Collection
      description: 'Return the intelligence collection state for a given date.


        RB-INTEL-021 — Answers: Did the pre-brief scan run? When? Which sources

        were scanned? How many signals were detected? What is collection health?


        Use this endpoint to answer any user question about whether intelligence

        collection executed, what was scanned, and what was found.


        Returns:

        - collection_window: when collection ran

        - refresh_status: Success | Partial | Failed

        - collection_health: Healthy | Degraded | Failed

        - sources_healthy / sources_failed / sources_unavailable counts

        - sources_scanned: list of source names that processed successfully

        - records_processed, records_added, mutations_generated

        - trust_score, trust_level

        - stale_sources: sources that did not refresh

        - source_detail: per-source health with records, trust, failure_reason

        - processing_errors: step-level errors from pipeline execution'
      operationId: getIntelligenceCollection
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO date (YYYY-MM-DD). Defaults to today.
          title: Date
        description: ISO date (YYYY-MM-DD). Defaults to today.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/collection/audit:
    get:
      tags:
      - compute
      summary: Get Intelligence Collection Audit
      description: 'Return the intelligence collection scan audit log.


        RB-INTEL-021 — Returns all collection scan records from the last N days,

        newest-first.  Each record is a durable receipt written by morning_pipeline

        after each run — not synthesized, not inferred.


        Use this endpoint to answer:

        - ''Show me all intelligence scans from the last 7 days''

        - ''Has the scan run every day this week?''

        - ''Were there any collection failures recently?''

        - ''What sources were scanned on Tuesday?'''
      operationId: getIntelligenceCollectionAudit
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          description: Number of days to look back (1-90).
          default: 7
          title: Days
        description: Number of days to look back (1-90).
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/signals:
    get:
      tags:
      - compute
      summary: Get Intelligence Signals
      description: 'Query the signal discovery ledger — knowledge mutations tracked
        by the IME.


        RB-INTEL-021 — Returns signals discovered and mutated by the intelligence

        mutation engine.  Enables queries like:

        - ''Show me all new signals discovered in the last 48 hours''

        - ''What signals were detected today?''

        - ''What intelligence changed since yesterday?''


        Each signal entry includes:

        - signal_id, discovery timestamp, source, confidence, importance

        - mutation history (what changed)

        - current status'
      operationId: getIntelligenceSignals
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 720
          minimum: 1
          description: Lookback window in hours (1–720).
          default: 48
          title: Days
        description: Lookback window in hours (1–720).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: new | mutated | all. Default: all.'
          title: Status
        description: 'Filter by status: new | mutated | all. Default: all.'
      - name: signal_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by signal type (e.g. 'relationship_signal', 'market_signal').
          title: Signal Type
        description: Filter by signal type (e.g. 'relationship_signal', 'market_signal').
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/jobs:
    get:
      tags:
      - compute
      summary: Get Job Intelligence
      description: 'Return job opportunity signals detected from email and LinkedIn
        messages.


        Gated by opportunity_context.yaml → job_search_active.

        Returns gate_status=''inactive'' when job_search_active is false — no signals

        are ever returned when the user is not searching.


        When active, returns roles detected in the last scan_days window, ordered

        by fit_score descending.  Each signal includes:

        - extracted_titles: detected role titles

        - extracted_companies: detected company names

        - posting_urls: direct links to job postings when available

        - fit_score: 0–100 match against user profile

        - fit_reasons: why the score was assigned

        - is_speculative: true when no posting URL found

        - source: email | linkedin

        - recommended_action: what to do next


        Use when the user asks: ''Any job leads today?'', ''Did any roles come in?'',

        ''What opportunities are in my inbox?'''
      operationId: getJobIntelligence
      parameters:
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Re-run the scanner instead of using cache.
          default: false
          title: Refresh
        description: Re-run the scanner instead of using cache.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /intelligence/jobs/toggle:
    post:
      tags:
      - write
      summary: Toggle Job Search
      description: 'Enable or disable job search intelligence scanning.


        Writes job_search_active to opportunity_context.yaml.  When set to false,

        job_intelligence section is completely suppressed from the daily brief.


        Use when the user says: ''I''m open to new opportunities'', ''Start scanning

        for jobs'', ''I''m not looking anymore'', ''Turn off job search''.'
      operationId: toggleJobSearch
      parameters:
      - name: active
        in: query
        required: true
        schema:
          type: boolean
          description: true to enable job search scanning, false to disable.
          title: Active
        description: true to enable job search scanning, false to disable.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /draft-actions:
    get:
      tags:
      - compute
      summary: Get Draft Actions
      description: Return DraftSpec objects from the action_drafts cache.
      operationId: getDraftActions
      parameters:
      - name: contact_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter DraftSpec rows by baseline contact id.
          title: Contact Id
        description: Filter DraftSpec rows by baseline contact id.
      - name: action_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter DraftSpec rows by action type.
          title: Action Type
        description: Filter DraftSpec rows by action type.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /validate_baseline:
    get:
      tags:
      - compute
      summary: Get Validate Baseline
      description: Schema + integrity check on baseline_index.json.
      operationId: get_validate_baseline_validate_baseline_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gap_detection:
    get:
      tags:
      - compute
      summary: Get Gap Detection
      description: RCs without cards, orphan cards, RCs without last_touch, contact-field
        gaps.
      operationId: get_gap_detection_gap_detection_get
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /loops:
    get:
      tags:
      - compute
      summary: Get Loops
      description: Loop ledger bucketed by status relative to a target date.
      operationId: getLoops
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - write
      summary: Post Loop Add
      operationId: addLoop
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoopAddIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /meeting_prep:
    get:
      tags:
      - compute
      summary: Get Meeting Prep Candidates
      description: 'Calendar events from today+tomorrow that qualify for a pre-conversation
        brief.


        Read-only: returns the structured prep payload per qualifying event so a

        Custom GPT can preview the brief before committing the artifact to disk.

        Per ARCHITECTURE.md "Pre-conversation briefing", the artifact follows the

        11-section structure; empty subsections are omitted, not stubbed.'
      operationId: getMeetingPrepCandidates
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'ISO date for the brief context (default: today).'
          title: Date
        description: 'ISO date for the brief context (default: today).'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /meeting_prep/{event_id}:
    get:
      tags:
      - compute
      summary: Get Meeting Prep For Event
      description: 'Generate a single event''s prep payload + rendered markdown (read-only).


        The markdown returned here matches what `POST /meeting_prep/write`

        materializes when `confirm=true`. No file is written.'
      operationId: getMeetingPrepForEvent
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /captures/scan:
    post:
      tags:
      - write
      summary: Post Scan Capture Sources
      description: 'Kick off a scan of enabled capture sources (Just Press Record,
        RB

        Captures Drop Folder, etc.) for files newer than the last scan --

        getCapturesPending has NO path to trigger this itself.


        Real gap found 2026-08-27: getCapturesPending only reads what a PRIOR

        sweep already queued into system/captures/pending/; it never looks at

        the actual source folders. The only thing that called capture_ingest

        .sweep() was the scheduled morning_pipeline.py run, once a day. A real

        recording made any time after that (e.g. mid-afternoon) was genuinely

        invisible to chat -- confirmed live: getCapturesPending reported zero

        pending JPR files while three real .m4a recordings sat in the watched

        iCloud folder, because the last sweep was that morning.


        Runs in the BACKGROUND, not inline -- confirmed live the same day that

        real local Whisper transcription of just 3 short recordings took well

        over two minutes on CPU, which would blow past the chat orchestrator''s

        tool-call timeout if this blocked the response. Returns immediately.

        Call getCaptureScanStatus after roughly a minute to see whether it

        finished and what it found, then call getCapturesPending to see the

        newly queued items. Only call this when the user explicitly asks to

        process something newer than what''s already pending -- not on every

        routine check.'
      operationId: scanCaptureSources
      parameters:
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Limit to one source id, e.g. 'just_press_record'. Omit to scan
            all enabled sources.
          title: Source
        description: Limit to one source id, e.g. 'just_press_record'. Omit to scan
          all enabled sources.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /captures/scan/status:
    get:
      tags:
      - compute
      summary: Get Capture Scan Status
      description: 'Check whether a background scan started by scanCaptureSources
        has

        finished, and see its result (files_queued, per-file status). If

        ''running'' is true, the scan is still going -- wait and check again

        rather than starting a second scan.'
      operationId: getCaptureScanStatus
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /captures/pending:
    get:
      tags:
      - compute
      summary: Get Captures Pending
      description: 'List captures queued by the morning sweep awaiting GPT intelligence
        processing.


        Returns metadata for each pending capture. Set include_transcript=true to

        get the full text in one call, or fetch individually via GET /captures/{id}.


        On-demand trigger phrase: "RB, process my [person] meeting" or

        "RB, process the transcript" — GPT calls this endpoint, finds the relevant

        capture, then submits it to POST /captures/{id}/submit.'
      operationId: getCapturesPending
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
