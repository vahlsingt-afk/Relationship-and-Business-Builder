        to: micro (operator/store graph), macro (behavioral signals), relationship\n\
        (contacts, WMN), intelligence (research), ecosystem (tech stack/vendors),\n\
        artifact (account dossiers), campaign (conference invites), signals\n(exit/growth/distress).\n\
        \nRB-2026-08-28: despite the name, this does NOT cover every RB module --\n\
        Blue Sheets, Master Account Plans, and Account Research background briefs\n\
        were all built after this endpoint and are NOT among the modules it\ndispatches\
        \ to (same gap listArtifacts had, closed the same day). For\nthose, use listBlueSheetAccounts/getAccountStatus,\n\
        listMasterAccountPlans/getMasterAccountPlan, or\nlistAccountResearch/getAccountResearch\
        \ directly, or queryIntelligenceIndex\nfor a cross-subsystem pointer search\
        \ that DOES include them.\n\nAccepts a natural-language question + optional\
        \ entity name. Parses intent\ndeterministically and dispatches to whichever\
        \ modules are relevant:\n\n- micro        — Micro graph structure (operators,\
        \ stores, co-ops, states)\n- macro        — Behavioral signals, brand risk,\
        \ entity risk profiles\n- relationship — Interaction history, Who Matters\
        \ Now leaderboard\n- intelligence — Gathered research, signal convergences,\
        \ entity summaries\n- ecosystem    — Restaurant/vendor tech-stack relationships\
        \ (POS, payments,\n                 loyalty, KDS, digital menu boards), incumbent\
        \ + candidate research\n- artifact     — Registered account dossiers (Global\
        \ Payments, Foods Connected,\n                 PAR Technology, Xenial, etc.)\
        \ — status, key contacts, next actions\n- campaign     — Conference invitation\
        \ roster, registration status, coverage\n                 gaps, priority invite\
        \ list (dispatches to campaign_engine.py)\n- signals      — Entity signal\
        \ pattern (exit/growth/distress) from signal_synthesis\n\nReturns a synthesized\
        \ answer string + per-module structured results +\nsource attribution. Multiple\
        \ modules may activate for a single question.\n\nThis endpoint replaces the\
        \ seven individual query endpoints\n(queryRelationships, queryWhoMattersNow,\
        \ queryMacroSignals, queryMacroArtifacts,\nqueryMacroEntities, queryInsights,\
        \ getIntelligence) in the Custom GPT schema.\nThose endpoints remain available\
        \ in the full API for internal use."
      operationId: queryEngine
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedQueryIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /contacts/linkedin_profile_bookmarklet:
    get:
      tags:
      - compute
      summary: Get Linkedin Profile Bookmarklet
      description: "Return a browser bookmarklet that captures a LinkedIn profile\
        \ page and POSTs\nit directly to the RB server — no terminal, no browser console,\
        \ no JSON copy/paste.\n\nOne-time setup (30 seconds):\n  1. Call this endpoint\
        \ to get the bookmarklet.\n  2. Create a new browser bookmark, paste the returned\
        \ `bookmarklet_href` as the URL.\n  3. Name it something like 'RB: Capture\
        \ LinkedIn'.\n\nPer-profile workflow (5 seconds):\n  1. Navigate to any LinkedIn\
        \ profile page (linkedin.com/in/<slug>).\n  2. Click the bookmark.\n  3. A\
        \ small overlay appears showing capture status. Done — the profile and\n \
        \    any visible posts are ingested into RB baseline and social feed.\n\n\
        The bookmarklet embeds the API key and server URL. Because RB runs locally\n\
        (localhost), this is safe — the credentials never leave your machine."
      operationId: getLinkedInProfileBookmarklet
      parameters:
      - name: server_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: RB server base URL, e.g. http://localhost:8765. Defaults to
            the request's own origin.
          title: Server Url
        description: RB server base URL, e.g. http://localhost:8765. Defaults to the
          request's own origin.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sms/exempt_handles:
    get:
      tags:
      - write
      summary: Get Sms Exempt Handles
      description: 'Return the current SMS intelligence exempt-handles list with resolved
        names.


        Exempt handles are contacts (family/friends) whose inbound SMS messages

        are skipped by the intelligence processing pipeline. All other inbound

        messages are processed under the opt-out model (mode=''all'').'
      operationId: getSmsExemptHandles
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - write
      summary: Post Sms Exempt Handle
      description: 'Add a phone number or email address to the SMS intelligence exempt
        list.


        Pass a 10-digit US phone number (digits only, e.g. ''2145551234'') or an

        email address. The handle is normalized before storing.


        Use this when the user says things like ''exempt my wife'', ''don''t monitor

        texts from my sister'', or ''add 2145551234 to the exempt list''.

        Resolve the contact''s phone via /contacts/resolve or ask the user for

        the number if unknown.'
      operationId: addSmsExemptHandle
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsExemptBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sms/exempt_handles/{handle}:
    delete:
      tags:
      - write
      summary: Delete Sms Exempt Handle
      description: 'Remove a phone number or email from the SMS intelligence exempt
        list.


        Pass the handle exactly as stored (10-digit phone or email). After removal

        that contact''s inbound messages will be processed for intelligence signals.


        Use when the user says ''stop exempting X'', ''monitor texts from Y again'',
        etc.'
      operationId: removeSmsExemptHandle
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
          title: Handle
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /briefs/intelligence:
    get:
      tags:
      - read
      summary: Get Rendered Intelligence Brief
      description: "Return the pre-rendered Intelligence Brief (Part 1) for a given\
        \ date.\n\nThe brief is generated at 5am by render_intelligence_brief.py.\
        \ If not yet\nrendered for today, renders on-demand from the current daily_brief\
        \ cache.\n\nReturns:\n  - date: ISO date string\n  - rendered_at: when the\
        \ file was written (from metadata JSON if available)\n  - markdown: the full\
        \ pre-rendered markdown string\n  - source: \"pre_rendered\" | \"on_demand\""
      operationId: getRenderedIntelligenceBrief
      parameters:
      - name: target_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Date
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /briefs/daily:
    get:
      tags:
      - read
      summary: Get Rendered Daily Brief
      description: "Return the pre-rendered Daily Brief (Part 2) for a given date.\n\
        \nThe brief is generated at 5am by render_daily_brief.py. If not yet\nrendered\
        \ for today, renders on-demand from the current daily_brief cache.\n\nReturns:\n\
        \  - date: ISO date string\n  - rendered_at: when the file was written\n \
        \ - markdown: the full pre-rendered markdown string\n  - source: \"pre_rendered\"\
        \ | \"on_demand\""
      operationId: getRenderedDailyBrief
      parameters:
      - name: target_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Date
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /briefs/list:
    get:
      tags:
      - read
      summary: List Rendered Briefs
      description: "List all pre-rendered briefs available on disk.\n\nReturns a list\
        \ of available briefs (most recent first) with:\n  - date: ISO date string\n\
        \  - intelligence_brief: true/false\n  - daily_brief: true/false\n  - rendered_at_intelligence:\
        \ timestamp or null\n  - rendered_at_daily: timestamp or null\n\nUsed by the\
        \ GPT for historical context (\"what did the brief say on X?\").\nPass days\
        \ to limit the window (default: 30)."
      operationId: listRenderedBriefs
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Days
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ArtifactClassifyIn:
      properties:
        path:
          type: string
          title: Path
          description: Local path or uploaded-file handle for the artifact. If this
            is a LinkedIn export ZIP, classify it and route immediately to ingestLinkedInExport;
            do not ask the operator for intended use.
      type: object
      required:
      - path
      title: ArtifactClassifyIn
    ArtifactEnrichIn:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
          description: New signal text to enrich the artifact with.
        source_type:
          type: string
          title: Source Type
          description: paste | file | screenshot | url
          default: paste
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
          description: Optional source filename or URL.
        event_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Event At
          description: Optional ISO date of the intelligence.
        confirm:
          type: boolean
          title: Confirm
          description: confirm=false previews enrichment; confirm=true applies it.
          default: false
      type: object
      title: ArtifactEnrichIn
    CloseoutIn:
      properties:
        confirm:
          type: boolean
          title: Confirm
          default: false
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      type: object
      title: CloseoutIn
      description: "Body for POST /closeout.\n\nDual-mode (kept as one op within the\
        \ 30-op Custom GPT cap):\n  * confirm=false — return the structured closeout\
        \ payload; no writes.\n  * confirm=true — write the closeout markdown artifact\
        \ to\n    system/closeouts/YYYY-MM-DD.md. The artifact is a projection, not\n\
        \    canonical state, so no schema validation runs. Existing files are\n \
        \   snapshotted before overwrite."
    ConfirmProposalBody:
      properties:
        kind:
          type: string
          enum:
          - identity_match
          - relationship
          - insight
          - macro_record
          - macro_entity
          - experience
          - weekly_plan
          - tech_stack_relationship
          - watchlist_promotion
          - priority_account_publisher_match
          - ownership_change
          - executive_move
          title: Kind
          description: Which proposal type `id` refers to.
        id:
          type: string
          title: Id
          description: 'The SPECIFIC proposal/mutation''s own id, taken from within
            the tool response that proposed it (e.g. a mutation_proposals[] entry''s
            own id) -- NEVER a triage_id (format ''TRG-YYYY-MM-DD-NNN'', that''s intelligence_triage''s
            own tracking id for the input as a whole, not any one proposal inside
            it). Confirmed live 2026-08-27: 5/5 real calls failed, all reusing a triage_id
            here for kind=macro_record and kind=relationship, neither of which use
            that id space. Also: if the tool that generated the proposal reported
            nothing was persisted/proposed (e.g. persistence_status="RB did not persist"),
            there is nothing to confirm -- do not call this at all.'
        confirmed:
          type: boolean
          title: Confirmed
          description: True records/confirms the proposal; false rejects it.
          default: true
        write_email:
          type: boolean
          title: Write Email
          description: 'identity_match only, when confirmed=true: whether to write
            the inbound sender address onto the baseline record as their email. Set
            false when the identity link is real but the address itself isn''t theirs
            — e.g. invitations@linkedin.com or another platform/notification relay.'
          default: true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'identity_match only: optional note explaining why write_email
            was set false.'
        owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Name
          description: 'ownership_change only, when confirmed=true: the real, confirmed
            owner/parent-company name. Required unless the candidate already has a
            proposed_owner_name (from best-effort text extraction) -- supplying this
            always overrides that prefilled value, e.g. to correct a wrong-direction
            extraction. Read the candidate''s evidence_excerpt yourself before trusting
            either one; never guess.'
        owner_entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Entity Id
          description: 'ownership_change only: the owner''s real entity_id, when
            the owner is itself an already-tracked brand/vendor entity. Omit to let
            RB resolve it automatically from owner_name; only set this to override
            that resolution.'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: 'executive_move only, when confirmed=true: the real, confirmed
            executive name. Required unless the candidate already has a proposed_name
            (from best-effort text extraction) -- supplying this always overrides
            that prefilled value. Read the candidate''s evidence_excerpt yourself
            before trusting either one; never guess.'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: 'executive_move only: the executive''s real title/role, if
            known. Overrides the candidate''s own proposed_title when supplied;
            either may be omitted if genuinely unknown.'
        contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Id
          description: 'executive_move only: the real baseline_index.json contact
            id to update, when the candidate''s action is "update_existing_contact".
            Overrides the candidate''s own matched_contact_id -- use this to correct
            a wrong name match, or to supply one the scanner didn''t find. Leave
            unset for a genuinely new contact (action "create_new_contact").'
      type: object
      required:
      - kind
      - id
      title: ConfirmProposalBody
    ContactAddIn:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        signal_class:
          type: string
          title: Signal Class
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        linkedin:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedin
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        last_touch:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Touch
        rc_tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Rc Tier
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - id
      - name
      - signal_class
      title: ContactAddIn
    ContactsIngestIn:
      properties:
        contacts_text:
          type: string
          title: Contacts Text
          description: 'Full text content of the contacts file. For VCF: read with
            open(''/mnt/user-data/uploads/contacts.vcf'',''r'',encoding=''utf-8'').read().
            For CSV: read similarly. Send raw text — do not base64-encode.'
        filename:
          type: string
          title: Filename
          description: Original filename (.vcf or .csv) — used to select the correct
            parser.
          default: contacts.vcf
        dry_run:
          type: boolean
          title: Dry Run
          default: false
      type: object
      required:
      - contacts_text
      title: ContactsIngestIn
      description: 'DEFECT-024d: Contacts file text ingest — VCF or CSV read by GPT
        Code Interpreter.'
    ContactsXLSXIngestIn:
      properties:
        content_base64:
          type: string
          title: Content Base64
          description: 'Base64-encoded XLSX file content. GPT Code Interpreter: import
            base64; data = base64.b64encode(open(''/mnt/user-data/uploads/FILE.xlsx'',''rb'').read()).decode()'
        filename:
          type: string
          title: Filename
          default: apple_contacts_baseline_extract.xlsx
        dry_run:
          type: boolean
          title: Dry Run
          default: false
      type: object
      required:
      - content_base64
      title: ContactsXLSXIngestIn
      description: 'DEFECT-025: XLSX contacts ingest — apple_contacts_baseline_extract.xlsx.'
    CreateBlueSheetAccountBody:
      properties:
        account_slug:
          type: string
          title: Account Slug
          description: e.g. 'mcdonalds'
        display_name:
          type: string
          title: Display Name
          description: e.g. "McDonald's"
        account_data:
          additionalProperties: true
          type: object
          title: Account Data
          description: opportunities[], qualification, strategic_position, buying_influences[],
            technology_stack[], commercial_models[], latest_review, bottom_line --
            see blue_sheets/_engine/render.py for the exact field-by-field schema
            each tab reads. Must contain REAL, substantive content -- an all-empty
            account_data is rejected.
        brand_profile_data:
          additionalProperties: true
          type: object
          title: Brand Profile Data
          description: identity_ownership_footprint[] etc. -- see render_brand_tab
            in render.py.
        actions_data:
          items: {}
          type: array
          title: Actions Data
          description: actions[] -- see render_actions_tab in render.py.
        evidence_records:
          items: {}
          type: array
          title: Evidence Records
          description: Real evidence.jsonl entries citing actual sources for the content
            above.
        aliases:
          items: {}
          type: array
          title: Aliases
        user_authorization_quote:
          type: string
          minLength: 1
          title: User Authorization Quote
          description: 'REQUIRED. A verbatim quote of what the user actually said
            that constitutes explicit, unambiguous authorization to create a NEW Blue
            Sheet for this specific account -- e.g. ''create a blue sheet for McDonald''s''.
            Do not paraphrase or invent this -- copy the user''s own words from this
            conversation. A request to ''update the account plan'' for an account
            with no existing Blue Sheet is NOT authorization to create one -- if you
            are not looking at an explicit Blue Sheet creation request in the transcript,
            do not call this endpoint; ask the user first. RB-2026-08-28: a prior
            call to this endpoint silently stamped every creation as Todd-authorized
            regardless of what was actually said, producing an empty, unauthorized
            ''worldpay'' Blue Sheet from a portfolio-level document upload. This field
            exists so that never happens invisibly again.'
      type: object
      required:
      - account_slug
      - display_name
      - account_data
      - brand_profile_data
      - user_authorization_quote
      title: CreateBlueSheetAccountBody
    EarningsWatchlistBody:
      properties:
        action:
          type: string
          enum:
          - add
          - remove
          - auto_scan
          title: Action
          description: Mutation action. 'add' adds a company to the earnings calendar
            watch list. 'remove' removes a company by name or ticker. 'auto_scan'
            scans market signals for unlisted companies and adds those that exceed
            the appearance threshold.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Company name. Required for action=add or action=remove.
        ticker:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticker
          description: Stock ticker symbol (optional for action=add).
        edgar_cik:
          anyOf:
          - type: string
          - type: 'null'
          title: Edgar Cik
          description: SEC EDGAR CIK (optional for action=add).
        ir_rss_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Ir Rss Url
          description: IR press release RSS URL (optional for action=add).
        side:
          anyOf:
          - type: string
          - type: 'null'
          title: Side
          description: 'vendor_supply | operator_demand — which side of the industry
            graph (default: vendor_supply).'
        strategic_relevance:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategic Relevance
          description: 'high | medium | low — signal ranking weight (default: medium).'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Human-readable reason for the mutation.
        threshold:
          anyOf:
          - type: integer
          - type: 'null'
          title: Threshold
          description: 'Minimum appearance count for auto_scan to trigger an add (default:
            3).'
          default: 3
        confirm:
          type: boolean
          title: Confirm
          description: Set true to apply the mutation. When false (default), returns
            a preview with persistence_status=proposed_write_pending_confirmation.
          default: false
      type: object
      required:
      - action
      title: EarningsWatchlistBody
    EngagementIn:
      properties:
        post_id:
          type: string
          title: Post Id
        type:
          type: string
          title: Type
        engager_name:
          type: string
          title: Engager Name
        engager_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Engager Url
        at:
          anyOf:
          - type: string
          - type: 'null'
          title: At
        comment_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment Text
      type: object
      required:
      - post_id
      - type
      - engager_name
      title: EngagementIn
    ExecDeclIn:
      properties:
        text:
          type: string
          title: Text
          description: CEO first-person declaration text.
        event_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Event At
          description: ISO date of the event (defaults to today).
        entity_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Name
          description: Optional named entity the declaration concerns.
        opportunity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Opportunity Id
          description: Optional opportunity ID to scope mutations.
      type: object
      required:
      - text
      title: ExecDeclIn
    ExperienceConfirmBody:
      properties:
        experience_id:
          type: string
          title: Experience Id
          description: Experience record id to confirm/reject.
        confirmed:
          type: boolean
          title: Confirmed
          description: True records the experience; false rejects it.
          default: true
      type: object
      required:
