  /contacts/resolve_linkedin:
    get:
      tags:
      - compute
      summary: Resolve Linkedin Profile
      description: "RB-DEFECT-034 — recognize a supplied LinkedIn profile URL and\
        \ resolve it\nagainst the existing contact graph, instead of falling through\
        \ to a generic\n'please paste the profile content' deflection.\n\nThis is\
        \ an *identity-resolution* endpoint, not a live-fetch endpoint — RB\nhas no\
        \ LinkedIn scraping/API connector (and shouldn't build one casually;\nsee\
        \ RB-DEFECT-034's scope notes on ToS/fragility). What it *does* have is a\n\
        Full LinkedIn Export already loaded into `baseline_index.json` with a\n`linkedin_url`\
        \ field per contact — so most supplied URLs can be resolved\nagainst data\
        \ already on hand, with zero new retrieval.\n\nBehavior:\n  - **match found**\
        \ → returns `status: \"matched\"` plus the contact's id,\n    name, company/role,\
        \ baseline fields, and `card_hint` (call `getCard`\n    with this id for full\
        \ relationship intelligence — career history,\n    loop history, circles,\
        \ trust signals — already in the graph).\n  - **no match** → returns `status:\
        \ \"no_match\"` with an honest explanation\n    and `next_step` guidance (offer\
        \ to create a stub contact via\n    `manualRelationshipIntake`, do NOT silently\
        \ ask the user to paste\n    content as if no resolution were attempted).\n\
        \  - **unrecognized URL** → `status: \"not_a_linkedin_profile_url\"`.\n\n\
        Matching is by profile slug (the `/in/<slug>` segment), case-insensitive,\n\
        with trailing-slash/query-string/locale-prefix normalization — the same\n\
        identifier shape already recorded passively on baseline contacts from\nLinkedIn\
        \ export ingestion."
      operationId: resolveLinkedInProfile
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          description: A LinkedIn profile URL, e.g. https://www.linkedin.com/in/jane-doe-12345
          title: Url
        description: A LinkedIn profile URL, e.g. https://www.linkedin.com/in/jane-doe-12345
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /contacts/ingest_linkedin_profile:
    post:
      tags:
      - write
      summary: Post Ingest Linkedin Profile
      description: "RB-DEFECT-034 #2 — ingest a LinkedIn profile captured via browser-session\
        \ JS snippet.\n\nAccepts the JSON payload produced by running the profile\
        \ capture JavaScript snippet\nin the browser console on a LinkedIn profile\
        \ page (linkedin.com/in/<slug>). The user\npastes the JS, copies the output,\
        \ and posts it here.\n\nThis is the same 'browser-session capture' pattern\
        \ as the LinkedIn feed capture\n(linkedin_session_reader.py) — zero automation,\
        \ zero login, zero credentials stored.\nThe operator navigates to the page\
        \ in their own browser and manually captures what\nthey can already see.\n\
        \nBehavior (mirrors linkedin_session_reader.ingest_profile):\n  - Resolves\
        \ the profile slug against existing baseline contacts.\n  - **Match found**\
        \ → enriches the existing contact with fresh headline/company/role/\n    experience/education\
        \ from the capture, preserving all curated RB fields.\n  - **No match** →\
        \ creates a stub contact (`_stub: true`) for manual-intake follow-up.\n  -\
        \ `confirm=false` (default) → dry run, returns preview of what would change.\n\
        \  - `confirm=true` → writes to baseline_index.json.\n\nTo get the capture\
        \ JS snippet, run:\n    python3 system/scripts/linkedin_session_reader.py\
        \ --capture-profile-js"
      operationId: ingestLinkedInProfile
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
