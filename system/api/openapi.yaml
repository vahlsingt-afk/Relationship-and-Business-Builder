            ''McDonald\''s'') or person. Optional: omit for general questions like
            ''who matters most right now?'''
        question:
          type: string
          title: Question
          description: 'Natural language question. The engine parses intent and dispatches
            to whichever of the seven modules are relevant: micro graph (operator/store
